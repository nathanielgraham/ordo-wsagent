name: test
on:
  push:
    branches: [master]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -c "from ordo_wsagent import OrdoClient, WatchRegistry, is_terminal"
      - run: pytest -q
